name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'InstantPersianScreenTranslator_cloud_build_fixed.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check source archive
        run: test -f InstantPersianScreenTranslator_cloud_build_fixed.zip
      - name: Extract Android project
        run: unzip -q InstantPersianScreenTranslator_cloud_build_fixed.zip -d source
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle --no-daemon -p source/InstantPersianScreenTranslator assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InstantPersian-debug-apk
          path: source/InstantPersianScreenTranslator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
